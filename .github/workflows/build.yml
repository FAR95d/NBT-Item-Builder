name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            fabric_api: "0.141.6+1.21.11"
          - minecraft: "1.21.10"
            fabric_api: "0.138.4+1.21.10"
    name: Minecraft ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - uses: actions/upload-artifact@v4
        with:
          name: nbt-item-builder-${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
