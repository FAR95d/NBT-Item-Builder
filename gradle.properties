# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric properties (loom 1.18+ builds 1.21.x and 26.x alike)
loader_version=0.19.5
loom_version=1.18.4

# The version the jar is compiled against. Default is 1.21.11.
# For 1.21.10 build with:
#   ./gradlew build -Pminecraft_version=1.21.10 -Pfabric_api_version=0.138.4+1.21.10
# For 26.2 build with JDK 25, e.g.:
#   ./gradlew build -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2 -Dorg.gradle.java.home=$HOME/.local/jdk-25
minecraft_version=1.21.11
fabric_api_version=0.141.6+1.21.11

# Mod properties
mod_version=1.10.0
group=dev.nbtitembuilder
archives_base_name=nbt-item-builder
